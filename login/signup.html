<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSwap Campus</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #d1d565 0%, #e6b86bc9 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            perspective: 1000px;
        }

        .register-container {
            background: hwb(254 16% 54% / 0.33);
            width: 350px;
            margin: auto;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(41, 130, 194, 0.3);
            transform-style: preserve-3d;
            transition: transform 0.5s;
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #1663b594;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #6d88f6;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            width: 90%;
            padding: 10px;
            background: #fc0505;
            color: rgb(68, 157, 240);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.1s;
        }

        button:hover {
            background: #5bbf0ae0;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .register-successful {
            color: rgb(60, 255, 0);
            text-align: center;
            margin-top: 10px;
        }

        .register-error {
            color: red;
            text-align: center;
            margin-top: 10px;
        }

        .otp-container {
            display: flex;
            align-items: center;
            width: 90%;
            margin: 10px auto;
        }

        .otp-container input {
            width: calc(100% - 75px);
            margin: 0;
        }

        .otp-container button {
            width: 90px !important;
            height: 40px;
            margin-left: 8px;
            padding: 0;
        }

        .otp-container button:hover {
            background: #d91c1c;
        }
    </style>
</head>
<body>

    <div class="register-container">
        <h2>REGISTER</h2>
        <form id="registerForm">
            <input type="text" id="NAME" placeholder="NAME" required>
            <input type="text" id="USERNAME" placeholder="USERNAME" required>
            <input type="password" id="PASSWORD" placeholder="PASSWORD" required>
            <input type="password" id="CONFIRM_PASSWORD" placeholder="CONFIRM PASSWORD" required>
            <input type="number" id="MOBILE" placeholder="MOBILE" required>
            <input type="email" id="EMAIL" placeholder="EMAIL" required>
            <div class="otp-container">
                <input type="text" id="OTP" placeholder="Enter OTP" required>
                <button type="button" id="sendBtn" onclick="sendOTP()">Send</button>
            </div>
            <input type="text" id="LOCATION" placeholder="LOCATION">
            <button type="submit">REGISTER</button>
        </form>
        <div id="register"></div>
    </div>

    <script>
        let generatedOTP = "";
        let otpTimer = null;
        let otpExpired = false;

        function sendOTP() {
            // Generate a random 6-digit OTP
            generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();
            otpExpired = false;

            // TEMP for testing only — a real app sends this via email/SMS from a backend,
            // never shows it in an alert. Remove this line once you have a backend.
            alert("Your OTP is: " + generatedOTP);
            console.log("Generated OTP:", generatedOTP);

            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;

            let secondsLeft = 60;
            sendBtn.textContent = secondsLeft + "s";

            if (otpTimer) clearInterval(otpTimer);
            otpTimer = setInterval(() => {
                secondsLeft--;
                if (secondsLeft > 0) {
                    sendBtn.textContent = secondsLeft + "s";
                } else {
                    clearInterval(otpTimer);
                    otpExpired = true;
                    sendBtn.disabled = false;
                    sendBtn.textContent = "Send";
                }
            }, 1000);
        }

        document.getElementById('registerForm').addEventListener('submit', function (event) {
            event.preventDefault();

            const name = document.getElementById('NAME').value.trim();
            const username = document.getElementById('USERNAME').value.trim();
            const password = document.getElementById('PASSWORD').value;
            const confirm_password = document.getElementById('CONFIRM_PASSWORD').value;
            const number = document.getElementById('MOBILE').value.trim();
            const enteredOTP = document.getElementById('OTP').value.trim();
            const email = document.getElementById('EMAIL').value.trim();
            const location = document.getElementById('LOCATION').value.trim();
            const errorDiv = document.getElementById('register');

            if (!name || !username || !password || !confirm_password || !number || !email) {
                errorDiv.textContent = 'Please fill in all required fields.';
                errorDiv.style.color = 'red';
                return;
            }

            if (password !== confirm_password) {
                errorDiv.textContent = 'Passwords do not match.';
                errorDiv.style.color = 'red';
                return;
            }

            if (!enteredOTP) {
                errorDiv.textContent = 'Please enter the OTP.';
                errorDiv.style.color = 'red';
                return;
            }

            if (!generatedOTP) {
                errorDiv.textContent = 'Please click "Send" to get an OTP first.';
                errorDiv.style.color = 'red';
                return;
            }

            if (otpExpired) {
                errorDiv.textContent = 'OTP has expired. Please request a new one.';
                errorDiv.style.color = 'red';
                return;
            }

            if (enteredOTP !== generatedOTP) {
                errorDiv.textContent = 'Invalid OTP. Please try again.';
                errorDiv.style.color = 'red';
                return;
            }

            if (localStorage.getItem('user_' + username)) {
                errorDiv.textContent = 'User already exists. Please log in.';
                errorDiv.style.color = 'red';
                return;
            }

            // All checks passed — save the user
            const user = { name, username, password, number, email, location };
            localStorage.setItem('user_' + username, JSON.stringify(user));

            errorDiv.textContent = 'Registration successful! You can now log in.';
            errorDiv.style.color = 'green';

            setTimeout(() => {
                window.location.href = "index.html";
            }, 1500);
        });
    </script>
</body>
</html>
